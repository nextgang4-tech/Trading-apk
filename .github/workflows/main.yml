name: Build APK from ZIP

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          unzip -o "*.zip" -d extracted_project
          if [ $(ls -1 extracted_project | wc -l) -eq 1 ]; then
            FOLDER=$(ls -1 extracted_project)
            mv extracted_project/"$FOLDER"/* .
            mv extracted_project/"$FOLDER"/.* . 2>/dev/null || true
          else
            mv extracted_project/* .
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trading-App-APK
          path: app/build/outputs/apk/debug/*.apk
          
